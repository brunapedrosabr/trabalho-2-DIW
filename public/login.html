<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - GastroBH</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="assets/css/styles.css" />
    <style>
      body {
        background: linear-gradient(135deg, #ffe5b4 0%, #ffd89b 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
      }
      .login-container {
        max-width: 450px;
        margin: 0 auto;
      }
      .login-box {
        background: white;
        padding: 40px;
        border-radius: 10px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      }
      .login-box h3 {
        color: #ff8c42;
        margin-bottom: 30px;
      }
    </style>
  </head>
  <body>
    <div class="container login-container">
      <div class="login-box">
        <h3 class="text-center"><i class="bi bi-shop"></i> Login GastroBH</h3>

        <form id="form-login">
          <div class="mb-3">
            <label for="username" class="form-label">Usuário</label>
            <input type="text" class="form-control" id="username" required />
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Senha</label>
            <input
              type="password"
              class="form-control"
              id="password"
              required
            />
          </div>
          <button type="submit" class="btn btn-primary w-100 mb-3">
            Entrar
          </button>
        </form>

        <div class="text-center">
          <p>Não tem conta?</p>
          <a href="cadastro.html" class="btn btn-outline-primary">
            Criar Conta
          </a>
        </div>

        <div class="text-center mt-3">
          <a href="index.html" class="text-muted">Voltar para Home</a>
        </div>
      </div>
    </div>

    <script src="assets/scripts/login.js"></script>
    <script>
      document
        .getElementById("form-login")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          const username = document.getElementById("username").value;
          const password = document.getElementById("password").value;

          if (loginUser(username, password)) {
            alert("Login realizado com sucesso!");
            window.location.href = "index.html";
          } else {
            alert("Usuário ou senha incorretos!");
          }
        });
    </script>
  </body>
</html>
