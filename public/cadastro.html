<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="assets/css/styles.css" />
    <style>
      body {
        background: linear-gradient(135deg, #ffe5b4 0%, #ffd89b 100%);
        min-height: 100vh;
        padding: 40px 0;
      }
      .cadastro-box {
        background: white;
        padding: 40px;
        border-radius: 10px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        max-width: 500px;
        margin: 0 auto;
      }
      .cadastro-box h3 {
        color: #ff8c42;
        margin-bottom: 30px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="cadastro-box">
        <h3 class="text-center">
          <i class="bi bi-person-plus"></i> Criar Nova Conta
        </h3>

        <form id="form-cadastro">
          <div class="mb-3">
            <label for="txt_nome" class="form-label">Nome Completo *</label>
            <input type="text" class="form-control" id="txt_nome" required />
          </div>
          <div class="mb-3">
            <label for="txt_login" class="form-label">Usuário *</label>
            <input type="text" class="form-control" id="txt_login" required />
          </div>
          <div class="mb-3">
            <label for="txt_email" class="form-label">E-mail *</label>
            <input type="email" class="form-control" id="txt_email" required />
          </div>
          <div class="mb-3">
            <label for="txt_senha" class="form-label">Senha *</label>
            <input
              type="password"
              class="form-control"
              id="txt_senha"
              required
            />
          </div>
          <div class="mb-3">
            <label for="txt_senha2" class="form-label">Confirmar Senha *</label>
            <input
              type="password"
              class="form-control"
              id="txt_senha2"
              required
            />
          </div>
          <button type="submit" class="btn btn-primary w-100 mb-3">
            Cadastrar
          </button>
        </form>

        <div class="text-center">
          <p>Já tem conta?</p>
          <a href="login.html" class="btn btn-outline-primary"> Fazer Login </a>
        </div>

        <div class="text-center mt-3">
          <a href="index.html" class="text-muted">Voltar para Home</a>
        </div>
      </div>
    </div>

    <script src="assets/scripts/login.js"></script>
    <script>
      document
        .getElementById("form-cadastro")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          const nome = document.getElementById("txt_nome").value;
          const login = document.getElementById("txt_login").value;
          const email = document.getElementById("txt_email").value;
          const senha = document.getElementById("txt_senha").value;
          const senha2 = document.getElementById("txt_senha2").value;

          if (senha !== senha2) {
            alert("As senhas não conferem!");
            return;
          }

          const sucesso = await addUser(nome, login, senha, email);

          if (sucesso) {
            alert("Cadastro realizado com sucesso! Faça login para continuar.");
            window.location.href = "login.html";
          } else {
            alert("Erro ao cadastrar. Tente novamente.");
          }
        });
    </script>
  </body>
</html>
